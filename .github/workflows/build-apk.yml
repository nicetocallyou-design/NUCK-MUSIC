
name: Build MUSE MUSIC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Extract MUSE MUSIC project
        run: |
          unzip -q MUSE_MUSIC_Project.zip
          ls -la MuseMusic

      - name: Build Debug APK
        working-directory: MuseMusic
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MUSE-MUSIC-APK
          path: MuseMusic/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
